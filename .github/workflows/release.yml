name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: make app dmg

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/PRAG-*.dmg
          generate_release_notes: true
          # A DMG already attached by hand (and checksummed in the notes) wins.
          overwrite_files: false
